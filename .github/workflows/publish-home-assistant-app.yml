name: Publish Home Assistant App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-aarch64:
    name: Publish aarch64 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"

      - name: Validate tag and release metadata
        run: node scripts/validate-release.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: app
        run: |
          version="$(awk -F'"' '/^version:/ {print $2}' circuit-atlas/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./circuit-atlas
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_VERSION=${{ steps.app.outputs.version }}
          tags: |
            ghcr.io/kmcrandom/circuit-atlas-ha:${{ steps.app.outputs.version }}
            ghcr.io/kmcrandom/circuit-atlas-ha:latest
          labels: |
            org.opencontainers.image.source=https://github.com/kmcrandom/circuit-atlas-ha
            org.opencontainers.image.description=Local-first home electrical system documentation

      - name: Verify public aarch64 manifest
        run: |
          docker logout ghcr.io
          bash scripts/verify-published-image.sh "${{ steps.app.outputs.version }}"
